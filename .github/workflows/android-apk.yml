name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    name: Сборка APK
    runs-on: ubuntu-latest

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v7

      - name: Установить JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK уже установлен на GitHub-hosted Ubuntu runner.
      # Не используем android-actions/setup-android@v3: его текущий action.yml запускается на Node 20.
      - name: Добавить Android SDK tools в PATH
        run: echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Установить Android SDK Platform 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Настроить Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Собрать APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Подготовить файл для скачивания
        run: cp app/build/outputs/apk/debug/app-debug.apk Kitsu-Dolphy.apk

      - name: Загрузить APK как артефакт
        uses: actions/upload-artifact@v7
        with:
          name: Kitsu-Dolphy-apk
          path: Kitsu-Dolphy.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          
