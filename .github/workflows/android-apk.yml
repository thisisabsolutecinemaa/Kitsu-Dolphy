name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    name: Сборка APK
    runs-on: ubuntu-latest

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить Android SDK
        uses: android-actions/setup-android@v3

      - name: Установить Android SDK Platform 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Установить Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Собрать APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Подготовить файл для скачивания
        run: cp app/build/outputs/apk/debug/app-debug.apk Kitsu-Dolphy.apk

      - name: Загрузить APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: Kitsu-Dolphy-apk
          path: Kitsu-Dolphy.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
